<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280" role="img" aria-label="Airflow ELT with Data Quality Gates (in progress)">
  <title>Airflow ELT with Data Quality Gates (in progress)</title>
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0b1e"/><stop offset="1" stop-color="#05060f"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3d6a"/><stop offset="1" stop-color="#23254a"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5f7ff"/><stop offset="0.5" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="14" height="28" fill="#b6ff00"/><rect x="14" width="14" height="28" fill="#07080f"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="3" width="4" height="1" fill="#000" opacity="0.18"/></pattern>

    <linearGradient id="th" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a2cff" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0.22"/></linearGradient>
    <pattern id="diag" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#fff" opacity="0.04"/></pattern>
    <clipPath id="win"><rect width="580" height="280" rx="14"/></clipPath>
  </defs>
  
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
    .disp{font-family:'Orbitron','Arial Black','Segoe UI',Arial,sans-serif}
    .sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .float{animation:float 6s ease-in-out infinite}
    .float2{animation:float 8s ease-in-out infinite;animation-delay:-2s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#win)">
    <rect width="580" height="280" fill="#12132a"/>
    <rect width="580" height="280" fill="url(#bg)" opacity="0.9"/>
    
  <rect x="0" y="0" width="580" height="40" fill="url(#bar)"/>
  <line x1="0" y1="40" x2="580" y2="40" stroke="#fff" stroke-opacity="0.08"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="290.0" y="25" text-anchor="middle" class="mono" font-size="14" fill="#c8d0e0">airflow-elt.exe</text>
  <text x="558" y="25" text-anchor="end" class="mono" font-size="14" fill="#9aa3c7">─ □ ×</text>
    <rect y="40" width="580" height="86" fill="url(#th)"/>
    <rect y="40" width="580" height="86" fill="url(#diag)"/>
    <rect y="118" width="580" height="8" fill="url(#hazard)"/>
    <rect x="503.2" y="84" width="52.8" height="24" rx="5" fill="#b6ff00"/>
    <text x="529.6" y="100.5" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#101800" letter-spacing="0.6">ORCH</text>

    <text x="24" y="158" class="sans" font-size="19" font-weight="700" fill="#e8ecf8">Airflow ELT with Data Quality Gates</text>
    <text x="24" y="182" class="sans" font-size="13" fill="#9aa3c7">One DAG runs ingest, Spark, dbt, and quality checks with retries</text>
    <text x="24" y="200" class="sans" font-size="13" fill="#9aa3c7">and alerts, then publishes an HTML data-quality report.</text>
    <rect x="24" y="212" width="72" height="26" rx="13" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.35"/><text x="60.0" y="229" text-anchor="middle" class="sans" font-size="12.5" fill="#c8d0e0">Airflow</text><rect x="104" y="212" width="72" height="26" rx="13" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.35"/><text x="140.0" y="229" text-anchor="middle" class="sans" font-size="12.5" fill="#c8d0e0">PySpark</text><rect x="184" y="212" width="43" height="26" rx="13" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.35"/><text x="205.5" y="229" text-anchor="middle" class="sans" font-size="12.5" fill="#c8d0e0">dbt</text><rect x="235" y="212" width="65" height="26" rx="13" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.35"/><text x="267.5" y="229" text-anchor="middle" class="sans" font-size="12.5" fill="#c8d0e0">Docker</text><rect x="308" y="212" width="65" height="26" rx="13" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-opacity="0.35"/><text x="340.5" y="229" text-anchor="middle" class="sans" font-size="12.5" fill="#c8d0e0">pytest</text>
    <circle class="pulse" cx="30" cy="261" r="4" fill="#b6ff00"/>
    <text x="42" y="265" class="mono" font-size="12" fill="#b6ff00">in progress · live demo and repo coming soon</text>
    <rect width="580" height="280" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="579" height="279" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.3"/>
</svg>