<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="Contact">
  <title>Contact</title>
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0b1e"/><stop offset="1" stop-color="#05060f"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3d6a"/><stop offset="1" stop-color="#23254a"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5f7ff"/><stop offset="0.5" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="14" height="28" fill="#b6ff00"/><rect x="14" width="14" height="28" fill="#07080f"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="3" width="4" height="1" fill="#000" opacity="0.18"/></pattern>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#7a2cff"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
  </defs>
  
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
    .disp{font-family:'Orbitron','Arial Black','Segoe UI',Arial,sans-serif}
    .sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .float{animation:float 6s ease-in-out infinite}
    .float2{animation:float 8s ease-in-out infinite;animation-delay:-2s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <text x="4" y="20" class="mono" font-size="14" fill="#00f0ff" letter-spacing="1.5">// 05 · UPLINK</text>
  <text x="2" y="62" class="disp" font-size="38" font-weight="700" letter-spacing="2" fill="url(#chrome)">Contact</text>
  <rect x="0" y="76" width="900" height="2" fill="url(#rule)" opacity="0.7"/>
</svg>